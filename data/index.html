<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f5;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #333;
    }

    .container {
      text-align: center;
      padding: 60px 40px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      max-width: 480px;
      width: 90%;
    }

    .code {
      font-size: 72px;
      font-weight: 700;
      color: #c0392b;
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
    }

    .divider {
      width: 48px;
      height: 3px;
      background-color: #c0392b;
      margin: 20px auto;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">403</div>
    <h1>アクセス禁止</h1>
    <div class="divider"></div>
    <p>このディレクトリへのアクセスは許可されていません。<br>お探しのページが見つからない場合は、管理者にお問い合わせください。</p>
  </div>
</body>
</html>
